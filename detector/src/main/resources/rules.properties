# Fraud rule thresholds (defaults, bundled in the jar).
#
# To tune without recompiling, copy this file, edit it, and run:
#   RULES_FILE=/path/to/my-rules.properties java -jar target/fraud-detector-0.1.0-jar-with-dependencies.jar
# Keys in RULES_FILE override the defaults below; missing keys keep the default.

# VELOCITY: alert when a card makes MORE than max.count payments within window.seconds.
velocity.max.count=5
velocity.window.seconds=60
# How long a window stays open for out-of-order (late) payments, in event time.
velocity.grace.seconds=10

# GEO_MISMATCH: alert when two payments on one card come from different
# countries within window.minutes of each other.
geo.window.minutes=10

# AMOUNT_SPIKE: alert when amount > multiplier x the card's running average,
# only after the card has at least min.payments prior payments.
spike.multiplier=5.0
spike.min.payments=5

# OVER_LIMIT has no threshold here: it uses each card's spending_limit from card-profiles.
